<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mountain Run</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b2a7a; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .serif { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
  #read { position: fixed; left: calc(14px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); text-shadow: 0 1px 8px rgba(8, 30, 100, 0.8); pointer-events: none; }
  #alt { font-size: 30px; line-height: 1.1; }
  #spd { font-size: 19px; opacity: 0.95; min-height: 22px; }
  #btns { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 70vw; }
  button { font: inherit; font-weight: 800; letter-spacing: 1px; font-size: 14px; color: #0c2468; background: rgba(255, 255, 255, 0.9); border: 0; border-radius: 999px; padding: 11px 16px; cursor: pointer; }
  button:active { transform: scale(0.96); }
  #skibtn { background: #ffd23f; color: #241a00; }
  #vrbtn, #vrbtn2 { display: none; background: #16307e; color: #fff; }
  #msg { position: fixed; left: 0; right: 0; top: 22%; text-align: center; font-size: clamp(22px, 5vw, 44px); text-shadow: 0 2px 14px rgba(8, 30, 100, 0.85); pointer-events: none; opacity: 0; transition: opacity 0.5s; padding: 0 16px; white-space: pre-line; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); text-align: center; font-size: 14px; text-shadow: 0 1px 6px rgba(8, 30, 100, 0.9); pointer-events: none; padding: 0 130px; opacity: 0.95; }
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.12); display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, 0.8); }
  #start { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: linear-gradient(180deg, rgba(8, 28, 110, 0.55), rgba(8, 28, 110, 0.15) 55%, rgba(255, 255, 255, 0)); }
  #start h1 { margin: 0; font-size: clamp(40px, 11vw, 92px); font-weight: 400; letter-spacing: 2px; text-shadow: 0 3px 22px rgba(6, 22, 90, 0.8); }
  #start p { margin: 10px 0 20px; font-size: 17px; max-width: 520px; text-shadow: 0 1px 8px rgba(6, 22, 90, 0.9); }
  #start .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #start button { font-size: 18px; padding: 15px 30px; }
  #go { background: #ffd23f; color: #241a00; }
  #back { margin-top: 20px; color: #fff; font-size: 14px; opacity: 0.9; }
  #fps { position: fixed; left: 14px; bottom: 10px; font-size: 12px; opacity: 0.8; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="read" class="serif"><div id="alt"></div><div id="spd"></div></div>
<div id="btns"><button id="skibtn">SKIS ON</button><button id="topbtn">SUMMIT</button><button id="vrbtn">ENTER VR</button></div>
<div id="msg" class="serif"></div>
<div id="hint"></div>
<div id="joy"><div id="knob"></div></div>
<div id="fps"></div>
<div id="start">
  <h1 class="serif">Mountain Run</h1>
  <p id="sub">Loading the mountain...</p>
  <div class="row"><button id="go" style="display:none">START</button><button id="vrbtn2">ENTER VR</button></div>
  <a id="back" href="../">All games</a>
</div>
